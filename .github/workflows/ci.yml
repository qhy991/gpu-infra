name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source checkout
        run: python -m pip install .
      - name: Run contract and lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Validate the checked-in tasks
        run: |
          kernelctl task-check examples/a800_smoke/task.json
          kernelctl task-check examples/a800_cuda_smoke/task.json
          kernelctl task-check examples/a800_rmsnorm_smoke/task.json
          kernelctl task-check examples/fibserve_service/task.json
          kernelctl task-check examples/kda_report_import/task.json
          kernelctl service-check examples/fibserve_service/service.json
