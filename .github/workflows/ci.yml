name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source checkout
        run: python -m pip install .
      - name: Run contract and lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Validate the checked-in A800 task
        run: kernelctl task-check examples/a800_smoke/task.json
