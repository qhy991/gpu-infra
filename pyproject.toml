[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-infra"
version = "0.8.0"
description = "Agent-native kernel evaluation control and evidence plane"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Agent4Kernel"}]
dependencies = []

[project.scripts]
kernelctl = "kernel_infra.cli:main"
kernelinfra-fibserve = "kernel_infra.adapters.fibserve:main"
kernelinfra-cuda-container = "kernel_infra.adapters.cuda_container:main"
kernelinfra-kda-import = "kernel_infra.adapters.kda:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
